packages:
  - apps/*
  - packages/*
# Keep dependency targets inside the checkout so serverless tracing includes them.
enableGlobalVirtualStore: false
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  sharp: true
  esbuild: true
  "@nestjs/core": false

overrides:
  effect: 3.20.0
  deepmerge-ts: 8.0.0
