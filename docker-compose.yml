services:
  db:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: tientruyen
      POSTGRES_DB: tientruyen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-local-password}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tientruyen"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4.7-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-change-local-redis-password}",
      ]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-change-local-redis-password}",
          "ping",
        ]
      interval: 5s
      retries: 10
  search:
    image: getmeili/meilisearch:v1.12.8
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-local-search-key-32-characters}
      MEILI_NO_ANALYTICS: "true"
    volumes: ["search-data:/meili_data"]
  api:
    volumes: ["avatar-uploads:/app/uploads"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://tientruyen:${POSTGRES_PASSWORD:-change-local-password}@db:5432/tientruyen
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-local-redis-password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret-32chars}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-development-webhook-secret-32-characters}
      APP_ORIGIN: http://localhost:3000
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-development-totp-encryption-key-32characters}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.invalid}
      DEV_TOPUP_ENABLED: ${DEV_TOPUP_ENABLED:-false}
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  avatar-uploads:
  postgres-data:
  search-data:
