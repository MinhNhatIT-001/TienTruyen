name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_USER: tientruyen
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tientruyen
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tientruyen" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4.7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://tientruyen:test-only-password@localhost:5432/tientruyen
      REDIS_URL: redis://localhost:6379
      APP_ORIGIN: http://127.0.0.1:3000
      TOTP_ENCRYPTION_KEY: ci-only-encryption-key-32-characters
      DEV_TOPUP_ENABLED: "true"
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm typecheck && pnpm test && pnpm build
      - name: Integration
        run: |
          node apps/api/dist/main.js > /tmp/tientruyen-api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/api/health && break || sleep 1; done
          INTEGRATION_URL=http://127.0.0.1:4000/api pnpm test
      - run: pnpm audit --prod --audit-level high
